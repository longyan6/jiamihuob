<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>二进制加法计算器</title>
<style>
:root{--green:#116b57;--deep:#0b4e40;--ink:#18241f;--muted:#65716c;--line:#dfe4e1;--paper:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#eef2ef;}
body{position:relative;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#eef2ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;counter-reset:sum;-webkit-user-select:none;user-select:none;}
.mode,.key-toggle{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.app{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;padding:104px 14px 12px;display:flex;align-items:flex-start;justify-content:center;}
.card{width:min(100%,430px);overflow:hidden;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 18px 45px rgba(26,49,40,.14);padding:18px;contain:layout paint;}
header{margin-bottom:12px;}
.eyebrow{margin:0 0 3px;color:#138269;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;}
h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.04em;}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:14px 0 13px;padding:4px;border-radius:14px;background:#edf1ef;}
.tab{padding:9px 5px;border-radius:11px;color:#69736f;font-size:14px;font-weight:700;text-align:center;touch-action:manipulation;}
#modeDigits:checked ~ .app label[for="modeDigits"],#modeSum:checked ~ .app label[for="modeSum"]{color:#fff;background:var(--green);box-shadow:0 4px 10px rgba(17,107,87,.22);}
.digit-panel,.sum-panel{display:none;}
#modeDigits:checked ~ .app .digit-panel,#modeSum:checked ~ .app .sum-panel{display:block;}
.result{position:relative;overflow:hidden;margin-bottom:14px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(140deg,var(--deep),var(--green));}
.result::after{content:"";position:absolute;right:-28px;top:-52px;width:145px;height:145px;border-radius:50%;background:rgba(255,255,255,.07);}
.result-label{display:block;position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.72);font-weight:700;}
.picked{position:relative;z-index:1;min-height:48px;margin:2px 0 3px;font-size:42px;line-height:1.12;font-weight:800;font-variant-numeric:tabular-nums;}
.digit-panel .picked::after{content:var(--x,"0");}
.parts{position:relative;z-index:1;min-height:36px;font-size:13px;line-height:1.4;color:rgba(255,255,255,.82);overflow-wrap:anywhere;}
.digit-panel .parts{font-size:15px;line-height:1.2;}
.digit-panel .parts::after{content:var(--y,"0");}
.digit-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.digit span{display:block;margin:0 0 5px;color:var(--muted);font-size:11px;text-align:center;}
.digit select{width:100%;height:56px;padding:0 8px;border:1.5px solid var(--line);border-radius:15px;outline:none;color:var(--ink);background:#fff;font:800 25px/1 -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;text-align-last:center;appearance:auto;touch-action:manipulation;-webkit-user-select:auto;user-select:auto;}
.digit select:focus{border-color:#159277;box-shadow:0 0 0 3px rgba(21,146,119,.10);}
.sum-value::after{content:counter(sum);}
.sum-parts{min-height:20px;}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.key{display:flex;align-items:center;justify-content:center;min-height:50px;border:1.5px solid var(--line);border-radius:15px;background:#fff;color:#4d5954;font-size:17px;font-weight:750;touch-action:manipulation;}
.key-toggle[value="2048"]:checked{counter-increment:sum 2048;}
.key-toggle[value="1024"]:checked{counter-increment:sum 1024;}
.key-toggle[value="512"]:checked{counter-increment:sum 512;}
.key-toggle[value="256"]:checked{counter-increment:sum 256;}
.key-toggle[value="128"]:checked{counter-increment:sum 128;}
.key-toggle[value="64"]:checked{counter-increment:sum 64;}
.key-toggle[value="32"]:checked{counter-increment:sum 32;}
.key-toggle[value="16"]:checked{counter-increment:sum 16;}
.key-toggle[value="8"]:checked{counter-increment:sum 8;}
.key-toggle[value="4"]:checked{counter-increment:sum 4;}
.key-toggle[value="2"]:checked{counter-increment:sum 2;}
.key-toggle[value="1"]:checked{counter-increment:sum 1;}
#v2048:checked ~ .app .sum-panel label[for="v2048"],
#v1024:checked ~ .app .sum-panel label[for="v1024"],
#v512:checked ~ .app .sum-panel label[for="v512"],
#v256:checked ~ .app .sum-panel label[for="v256"],
#v128:checked ~ .app .sum-panel label[for="v128"],
#v64:checked ~ .app .sum-panel label[for="v64"],
#v32:checked ~ .app .sum-panel label[for="v32"],
#v16:checked ~ .app .sum-panel label[for="v16"],
#v8:checked ~ .app .sum-panel label[for="v8"],
#v4:checked ~ .app .sum-panel label[for="v4"],
#v2:checked ~ .app .sum-panel label[for="v2"],
#v1:checked ~ .app .sum-panel label[for="v1"]{border-color:#148269;color:#fff;background:linear-gradient(145deg,#198d72,var(--deep));box-shadow:0 5px 12px rgba(11,78,64,.18);}
.sum-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.sum-note{padding-left:.5em;color:#7a8580;font-size:11px;}
.reset{border:0;border-radius:11px;padding:8px 14px;color:#53605a;background:#ecefed;font-size:13px;font-weight:700;touch-action:manipulation;}

<div class="app">
  <main class="card">
    <header><p class="eyebrow">Power Sum</p><h1>二进制加法计算器</h1></header>
    <nav class="tabs" aria-label="计算方式">
      <label class="tab" for="modeDigits">四位选择拆分</label>
      <label class="tab" for="modeSum">点击数字求和</label>
    </nav>
    <section class="digit-panel" id="p">
      <div class="result"><span class="result-label">选择结果</span><div class="picked"></div><div class="parts"></div></div>
      <div class="digit-row"><label class="digit"><span>千位</span><select id="a" aria-label="千位" form="digitForm"><option id="a0" value="0">0</option><option id="a1" value="1">1</option><option id="a2" value="2">2</option><option id="a3" value="3">3</option><option id="a4" value="4">4</option></select></label><label class="digit"><span>百位</span><select id="b" aria-label="百位" form="digitForm"><option id="b0" value="0">0</option><option id="b1" value="1">1</option><option id="b2" value="2">2</option><option id="b3" value="3">3</option><option id="b4" value="4">4</option><option id="b5" value="5">5</option><option id="b6" value="6">6</option><option id="b7" value="7">7</option><option id="b8" value="8">8</option><option id="b9" value="9">9</option></select></label><label class="digit"><span>十位</span><select id="c" aria-label="十位" form="digitForm"><option id="c0" value="0">0</option><option id="c1" value="1">1</option><option id="c2" value="2">2</option><option id="c3" value="3">3</option><option id="c4" value="4">4</option><option id="c5" value="5">5</option><option id="c6" value="6">6</option><option id="c7" value="7">7</option><option id="c8" value="8">8</option><option id="c9" value="9">9</option></select></label><label class="digit"><span>个位</span><select id="d" aria-label="个位" form="digitForm"><option id="d0" value="0">0</option><option id="d1" value="1">1</option><option id="d2" value="2">2</option><option id="d3" value="3">3</option><option id="d4" value="4">4</option><option id="d5" value="5">5</option><option id="d6" value="6">6</option><option id="d7" value="7">7</option><option id="d8" value="8">8</option><option id="d9" value="9">9</option></select></label></div>
      <div class="sum-actions"><span class="sum-note">计算范围 0000-4095</span><button class="reset" type="reset" form="digitForm">归零</button></div>
    </section>
    <section class="sum-panel">
      <div class="result"><span class="result-label">当前总和</span><div class="picked sum-value"></div><div class="parts sum-parts">点击下方数字，可重复点击取消</div></div>
      <div class="keys"><label class="key" for="v2048">2048</label>
<label class="key" for="v1024">1024</label>
<label class="key" for="v512">512</label>
<label class="key" for="v256">256</label>
<label class="key" for="v128">128</label>
<label class="key" for="v64">64</label>
<label class="key" for="v32">32</label>
<label class="key" for="v16">16</label>

<label class="key" for="v4">4</label>

<label class="key" for="v1">1</label></div>
      <div class="sum-actions"><span class="sum-note">全部相加最大为 4095</span><button class="reset" type="reset" form="sumForm">清空</button></div>

  </main>
</div>
